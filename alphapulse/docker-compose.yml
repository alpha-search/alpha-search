# Full AlphaPulse stack: TimescaleDB + Redis + FastAPI API + alerts worker + Next.js.
# Usage:  cp .env.example .env  &&  docker compose up --build
services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: alphapulse
      POSTGRES_PASSWORD: alphapulse
      POSTGRES_DB: alphapulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alphapulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    # Create tables + seed demo data, then serve.
    command: >
      sh -c "python -m scripts.init_db &&
             python -m scripts.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    command: ["python", "-m", "workers.alerts_worker"]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    env_file: .env
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
